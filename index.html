<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hard 8 | Entertainment and experiential consulting</title>
  <meta name="description" content="Entertainment and experiential consulting. Los Angeles, CA.">
  <meta name="theme-color" content="#f2efe6">
  <link rel="canonical" href="https://hard8.biz/">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hard8.biz/">
  <meta property="og:title" content="Hard 8">
  <meta property="og:description" content="Entertainment and experiential consulting. Los Angeles, CA.">
  <meta property="og:image" content="https://hard8.biz/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet">

  <style>
    :root {
      --felt: #1b5e3f;
      --bone: #f2efe6;
      --felt-soft: rgba(27, 94, 63, 0.85);
      --felt-faint: rgba(27, 94, 63, 0.75);
      /* Inter (Google Fonts, open license). Wordmark is Bold; everything else is Light/Regular. */
      --sans: "Inter", "Helvetica Neue", Arial, sans-serif;
      --logo-w: clamp(150px, 22vw, 240px);
      --gutter: clamp(24px, 8vw, 128px); /* everything hangs off this left edge */
    }
    * { box-sizing: border-box; margin: 0; }
    html { background: var(--bone); }
    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background: var(--bone);
      color: var(--felt);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      text-align: left;
      padding: 64px var(--gutter) 32px;
    }
    /* Logo: the dice artwork plus "hard 8" set live in Inter Bold, proportioned like the stacked lockup */
    .lockup {
      width: var(--logo-w);
      margin-bottom: clamp(40px, 6vw, 56px);
    }
    .dice { display: block; width: 100%; height: auto; }
    .wordmark {
      margin-top: calc(var(--logo-w) * 0.12);
      font-weight: 700;
      font-size: calc(var(--logo-w) * 0.217);
      line-height: 1;
      letter-spacing: -0.025em;
    }
    .lede {
      font-weight: 300;
      font-size: clamp(22px, 2.6vw, 30px);
      line-height: 1.25;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }
    .sub {
      margin-top: 10px;
      font-weight: 300;
      font-size: clamp(16px, 1.6vw, 19px);
      line-height: 1.4;
      color: var(--felt-soft);
    }
    .contact {
      display: inline-block;
      margin-top: clamp(32px, 4.5vw, 44px);
      padding: 14px 26px;
      border: 1.5px solid var(--felt);
      border-radius: 9px; /* rounded like the dice */
      background: transparent;
      color: var(--felt);
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 0;
      text-decoration: none;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }
    .contact:hover,
    .contact:focus-visible {
      background: var(--felt);
      color: var(--bone);
    }
    .contact:focus-visible { outline: 2px solid var(--felt); outline-offset: 3px; }
    footer {
      padding: 24px var(--gutter);
      text-align: left;
      font-size: 13px;
      font-weight: 300;
      color: var(--felt-faint);
    }
    @media (prefers-reduced-motion: no-preference) {
      main > * { animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
      main > :nth-child(2) { animation-delay: 0.08s; }
      main > :nth-child(3) { animation-delay: 0.16s; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: none; }
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="lockup">
      <img class="dice" src="assets/hard8-dice.png" width="640" height="444" alt="">
      <h1 class="wordmark">hard 8</h1>
    </div>
    <div>
      <p class="lede">Entertainment and experiential consulting.</p>
      <p class="sub">Los Angeles, CA</p>
    </div>
    <!-- Address is assembled by script so it isn't sitting in the HTML for scrapers. -->
    <a class="contact" id="contact" href="#" data-user="info" data-domain="hard8.biz">Get in touch</a>
    <noscript><p class="sub">info at hard8.biz</p></noscript>
  </main>
  <footer>&copy; <span id="year">2026</span> Hard 8 LLC</footer>

  <script>
    (function () {
      var a = document.getElementById('contact');
      var addr = a.dataset.user + '@' + a.dataset.domain;
      a.href = 'mailto:' + addr;
      a.textContent = addr;
      document.getElementById('year').textContent = new Date().getFullYear();
    })();
  </script>
</body>
</html>
